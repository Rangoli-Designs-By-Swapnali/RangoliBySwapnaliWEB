<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Swapnali's Rangoli</title>

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff7fa,
          #f9edf3
        );

      color: #6e2f4b;

      min-height: 100vh;

      padding: 20px;
    }


    /* =========================================================
       MAIN PAGE
    ========================================================= */

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }


    /* =========================================================
       HEADER CARD
    ========================================================= */

    .header-card {
      background: #ffffff;

      border-radius: 24px;

      padding: 25px;

      text-align: center;

      box-shadow:
        0 8px 25px
        rgba(91, 23, 56, 0.10);

      margin-bottom: 20px;
    }


    .logo {
      width: 90px;
      height: 90px;

      object-fit: contain;

      display: block;

      margin: 0 auto 10px;
    }


    .brand-name {
      color: #7c173f;

      font-size: 28px;

      font-weight: 800;

      margin-bottom: 5px;
    }


    .tagline {
      color: #9b657b;

      font-size: 14px;

      margin-bottom: 20px;
    }


    /* =========================================================
       HEADER BUTTONS
    ========================================================= */

    .actions {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }


    .btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      text-decoration: none;

      border: none;

      cursor: pointer;

      border-radius: 10px;

      padding: 11px 18px;

      font-size: 14px;

      font-weight: 700;
    }


    .download-btn {
      background: #7c173f;

      color: white;
    }


    .download-btn:hover {
      background: #641331;
    }


    .instagram-btn {
      background: #f8e8ef;

      color: #7c173f;
    }


    .instagram-btn:hover {
      background: #f2d9e3;
    }


    /* =========================================================
       DESIGN GRID
    ========================================================= */

    .design-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 20px;
    }


    /* =========================================================
       DESIGN CARD
    ========================================================= */

    .design-card {
      background: #ffffff;

      border-radius: 22px;

      overflow: hidden;

      box-shadow:
        0 8px 24px
        rgba(91, 23, 56, 0.10);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .design-card:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 28px
        rgba(91, 23, 56, 0.14);
    }


    /* =========================================================
       IMAGE
    ========================================================= */

    .design-image-wrapper {
      width: 100%;

      aspect-ratio: 1 / 1;

      background: #f8f1f4;

      overflow: hidden;

      position: relative;
    }


    .design-image {
      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;
    }


    .image-missing {
      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #9a858d;

      font-size: 13px;

      background: #f7f2f4;

      text-align: center;
    }


    /* =========================================================
       DESIGN TITLE
    ========================================================= */

    .design-title {
      padding: 14px 16px 10px;

      font-size: 17px;

      font-weight: 800;

      color: #7c173f;
    }


    /* =========================================================
       VARIANTS
    ========================================================= */

    .variants {
      padding: 0 14px 14px;
    }


    .variant-row {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        max-content
        max-content;

      align-items: center;

      gap: 10px;

      padding: 10px 0;

      border-top: 1px solid #f0dfe6;
    }


    .variant-size {
      font-size: 14px;

      font-weight: 700;

      color: #7c173f;

      white-space: nowrap;
    }


    .variant-price {
      font-size: 14px;

      font-weight: 800;

      color: #a60048;

      white-space: nowrap;
    }


    /* =========================================================
       ACTIONS
    ========================================================= */

    .variant-actions {
      display: flex;

      align-items: center;

      justify-content: flex-end;

      gap: 7px;

      white-space: nowrap;
    }


    /* =========================================================
       CHECKBOX
    ========================================================= */

    .select-label {
      width: 38px;

      height: 38px;

      border-radius: 9px;

      background: #fbf0f5;

      border: 1px solid #ebd2dd;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;
    }


    .select-label input {
      width: 20px;

      height: 20px;

      cursor: pointer;

      accent-color: #8b1747;
    }


    /* =========================================================
       QUANTITY CONTROLS
    ========================================================= */

    .quantity-controls {
      height: 38px;

      display: flex;

      align-items: center;

      border-radius: 9px;

      overflow: hidden;

      background: #fbf0f5;

      border: 1px solid #ebd2dd;
    }


    .quantity-btn {
      width: 38px;

      height: 38px;

      border: none;

      background: #f8e7ef;

      color: #8b1747;

      font-size: 20px;

      font-weight: 800;

      cursor: pointer;
    }


    .quantity-btn:hover {
      background: #efd4e0;
    }


    .quantity-value {
      width: 34px;

      text-align: center;

      color: #7c173f;

      font-size: 14px;

      font-weight: 800;
    }


    /* =========================================================
       SELECTED CARD
    ========================================================= */

    .design-card.selected {
      box-shadow:
        0 0 0 2px #c35a83,
        0 10px 28px
        rgba(91, 23, 56, 0.14);
    }


    /* =========================================================
       CART BAR
    ========================================================= */

    .cart-bar {
      position: sticky;

      bottom: 15px;

      z-index: 50;

      margin-top: 22px;

      background: #7c173f;

      color: white;

      border-radius: 16px;

      padding: 14px 18px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      box-shadow:
        0 8px 25px
        rgba(91, 23, 56, 0.25);
    }


    .cart-info {
      display: flex;

      flex-direction: column;

      gap: 3px;
    }


    .cart-count {
      font-size: 13px;

      opacity: 0.9;
    }


    .cart-total {
      font-size: 18px;

      font-weight: 800;
    }


    .cart-button {
      border: none;

      background: white;

      color: #7c173f;

      border-radius: 10px;

      padding: 11px 18px;

      font-weight: 800;

      cursor: pointer;
    }


    .cart-button:hover {
      background: #f9eaf0;
    }


    /* =========================================================
       MODAL
    ========================================================= */

    .modal {
      position: fixed;

      inset: 0;

      background:
        rgba(60, 20, 38, 0.55);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 100;
    }


    .modal.show {
      display: flex;
    }


    .modal-content {
      width: 100%;

      max-width: 600px;

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.25);
    }


    .modal-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 18px;
    }


    .modal-title {
      font-size: 20px;

      font-weight: 800;

      color: #7c173f;
    }


    .close-button {
      width: 34px;

      height: 34px;

      border: none;

      border-radius: 50%;

      background: #f8e8ef;

      color: #7c173f;

      font-size: 20px;

      cursor: pointer;
    }


    /* =========================================================
       ORDER ITEMS
    ========================================================= */

    .order-items {
      display: flex;

      flex-direction: column;

      gap: 10px;

      margin-bottom: 18px;
    }


    .order-item {
      display: grid;

      grid-template-columns:
        55px
        1fr
        auto;

      align-items: center;

      gap: 10px;

      padding: 10px;

      border-radius: 12px;

      background: #fcf5f8;

      border: 1px solid #f0dfe6;
    }


    .order-thumb-wrapper {
      width: 55px;

      height: 55px;

      border-radius: 8px;

      overflow: hidden;

      background: #f3e9ed;
    }


    .order-thumb {
      width: 100%;

      height: 100%;

      object-fit: cover;
    }


    .order-details {
      min-width: 0;
    }


    .order-name {
      font-weight: 800;

      color: #7c173f;

      margin-bottom: 3px;
    }


    .order-meta {
      font-size: 12px;

      color: #8c6c79;

      line-height: 1.5;
    }


    .order-subtotal {
      font-weight: 800;

      color: #a60048;

      white-space: nowrap;
    }


    /* =========================================================
       MODAL TOTAL
    ========================================================= */

    .modal-total {
      display: flex;

      justify-content: space-between;

      align-items: center;

      border-top: 1px solid #ead6df;

      padding-top: 15px;

      margin-top: 10px;

      margin-bottom: 16px;
    }


    .modal-total span:first-child {
      font-weight: 700;

      color: #7c173f;
    }


    .modal-total span:last-child {
      font-size: 20px;

      font-weight: 900;

      color: #a60048;
    }


    /* =========================================================
       PLACE ORDER
    ========================================================= */

    .place-order-button {
      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 14px;

      background: #7c173f;

      color: white;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;
    }


    .place-order-button:hover {
      background: #641331;
    }


    /* =========================================================
       EMPTY CART
    ========================================================= */

    .empty-cart {
      text-align: center;

      padding: 25px;

      color: #927683;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      text-align: center;

      padding: 25px 10px;

      color: #9a7584;

      font-size: 12px;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      body {
        padding: 12px;
      }


      .design-grid {
        grid-template-columns: 1fr;

        gap: 15px;
      }


      .brand-name {
        font-size: 24px;
      }


      .variant-row {
        grid-template-columns:
          minmax(0, 1fr)
          max-content
          max-content;

        gap: 6px;
      }


      .variant-actions {
        gap: 4px;
      }


      .select-label {
        width: 35px;
        height: 35px;
      }


      .quantity-controls {
        height: 35px;
      }


      .quantity-btn {
        width: 35px;
        height: 35px;
      }


      .quantity-value {
        width: 30px;
      }


      .cart-bar {
        padding: 12px;
      }


      .cart-total {
        font-size: 16px;
      }


      .cart-button {
        padding: 10px 13px;
      }
    }


    @media (max-width: 400px) {

      .variant-size {
        font-size: 13px;
      }


      .variant-price {
        font-size: 13px;
      }


      .variant-row {
        gap: 4px;
      }


      .select-label {
        width: 32px;
        height: 32px;
      }


      .quantity-controls {
        height: 32px;
      }


      .quantity-btn {
        width: 32px;
        height: 32px;
      }


      .quantity-value {
        width: 27px;
      }
    }

  </style>
</head>


<body>

  <main class="page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <section class="header-card">

      <img
        src="logo.png"
        alt="Swapnali's Rangoli Logo"
        class="logo"
      >

      <h1 class="brand-name">
        Swapnali's Rangoli
      </h1>

      <p class="tagline">
        Beautiful • Traditional • Ready-Made Rangoli Designs
      </p>


      <div class="actions">

        <a
          href="Rangoli_Designs_By_Swapnali.pdf"
          download="Rangoli_Designs_By_Swapnali.pdf"
          class="btn download-btn"
        >
          ⬇️ Download PDF
        </a>


        <a
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener"
          class="btn instagram-btn"
        >
          📷 Instagram
        </a>

      </div>

    </section>



    <!-- =====================================================
         DESIGN GRID
    ====================================================== -->

    <section
      id="designGrid"
      class="design-grid"
    ></section>



    <!-- =====================================================
         CART BAR
    ====================================================== -->

    <section class="cart-bar">

      <div class="cart-info">

        <span
          id="cartCount"
          class="cart-count"
        >
          0 items
        </span>

        <span
          id="cartTotal"
          class="cart-total"
        >
          ₹0
        </span>

      </div>


      <button
        type="button"
        class="cart-button"
        onclick="openCart()"
      >
        🛒 View Order
      </button>

    </section>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

      © Swapnali's Rangoli

    </footer>

  </main>



  <!-- =======================================================
       ORDER MODAL
  ======================================================== -->

  <div
    id="orderModal"
    class="modal"
  >

    <div class="modal-content">


      <div class="modal-header">

        <h2 class="modal-title">
          Your Order
        </h2>


        <button
          type="button"
          class="close-button"
          onclick="closeCart()"
        >
          ×
        </button>

      </div>


      <div
        id="orderItems"
        class="order-items"
      ></div>


      <div class="modal-total">

        <span>
          Total Order Value
        </span>

        <span id="modalTotal">
          ₹0
        </span>

      </div>


      <button
        type="button"
        class="place-order-button"
        onclick="placeOrder()"
      >
        💬 Place Order on WhatsApp
      </button>

    </div>

  </div>



  <script>

    /* =========================================================
       GLOBAL DATA
    ========================================================= */

    let designs = [];

    const cart = {};


    /* =========================================================
       LOAD DESIGNS.JSON
    ========================================================= */

    async function loadDesigns() {

      try {

        const response = await fetch(
          "designs.json",
          {
            cache: "no-store"
          }
        );


        if (!response.ok) {

          throw new Error(
            `Unable to load designs.json (${response.status})`
          );

        }


        const data = await response.json();


        if (!Array.isArray(data)) {

          throw new Error(
            "designs.json must contain a JSON array."
          );

        }


        designs = normalizeDesigns(data);


        renderDesigns();

        updateCart();

      }

      catch (error) {

        console.error(error);


        const grid =
          document.getElementById("designGrid");


        grid.innerHTML = `

          <div style="
            grid-column:1/-1;
            padding:30px;
            text-align:center;
            background:#fff;
            border-radius:20px;
            color:#8b5268;
            box-shadow:0 6px 18px rgba(91,23,56,.10);
          ">

            <strong>
              Unable to load designs.
            </strong>

            <br><br>

            Make sure
            <b>designs.json</b>
            is in the same folder as this HTML.

            <br><br>

            <small>
              ${escapeHtml(error.message)}
            </small>

          </div>

        `;

      }

    }


    /* =========================================================
       NORMALIZE JSON
    ========================================================= */

    function normalizeDesigns(data) {

      return data
        .map((item, index) => {

          if (
            !item ||
            typeof item !== "object"
          ) {

            return null;

          }


          const designName =
            String(
              item.design || ""
            ).trim();


          const image =
            String(
              item.image || ""
            ).trim();


          if (
            !designName ||
            !image
          ) {

            return null;

          }


          const variants =
            Array.isArray(item.variants)

              ? item.variants

                  .map(variant => {

                    if (
                      !variant ||
                      typeof variant !== "object"
                    ) {

                      return null;

                    }


                    const size =
                      String(
                        variant.size || "Standard"
                      ).trim();


                    const price =
                      Number(
                        String(
                          variant.price ?? ""
                        )
                          .replace(/,/g, "")
                          .replace(/[₹$]/g, "")
                          .trim()
                      );


                    if (
                      !Number.isFinite(price)
                    ) {

                      return null;

                    }


                    return {
                      size,
                      price
                    };

                  })

                  .filter(Boolean)

              : [];


          return {

            id: index + 1,

            name: designName,

            image,

            variants

          };

        })

        .filter(Boolean);

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(value) {

      return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       RENDER DESIGNS
    ========================================================= */

    function renderDesigns() {

      const grid =
        document.getElementById(
          "designGrid"
        );


      grid.innerHTML = "";


      designs.forEach(design => {

        const card =
          document.createElement("article");


        card.className =
          "design-card";


        card.id =
          `design-card-${design.id}`;


        /* -----------------------------------------------------
           IMAGE
        ----------------------------------------------------- */

        const imageWrapper =
          document.createElement("div");


        imageWrapper.className =
          "design-image-wrapper";


        const image =
          document.createElement("img");


        image.className =
          "design-image";


        image.alt =
          design.name;


        setupImage(
          image,
          design.image,
          imageWrapper
        );


        imageWrapper.appendChild(
          image
        );


        card.appendChild(
          imageWrapper
        );


        /* -----------------------------------------------------
           TITLE
        ----------------------------------------------------- */

        const title =
          document.createElement("div");


        title.className =
          "design-title";


        title.textContent =
          `Design #${design.id}`;


        card.appendChild(
          title
        );


        /* -----------------------------------------------------
           VARIANTS
        ----------------------------------------------------- */

        const variantsContainer =
          document.createElement("div");


        variantsContainer.className =
          "variants";


        design.variants.forEach(
          (variant, variantIndex) => {

            const row =
              document.createElement("div");


            row.className =
              "variant-row";


            row.dataset.designId =
              design.id;


            row.dataset.variantIndex =
              variantIndex;


            row.innerHTML = `

              <span class="variant-size">
                ${escapeHtml(variant.size)}
              </span>


              <span class="variant-price">
                ₹${formatPrice(variant.price)}
              </span>


              <div class="variant-actions">

                <label
                  class="select-label"
                  title="Select"
                >

                  <input
                    type="checkbox"

                    data-design-id="${design.id}"

                    data-variant-index="${variantIndex}"

                    onchange="
                      toggleVariant(
                        ${design.id},
                        ${variantIndex},
                        this.checked
                      )
                    "
                  >

                </label>


                <div class="quantity-controls">

                  <button
                    type="button"
                    class="quantity-btn"

                    onclick="
                      changeQuantity(
                        ${design.id},
                        ${variantIndex},
                        -1
                      )
                    "
                  >
                    −
                  </button>


                  <span
                    class="quantity-value"
                    id="qty-${design.id}-${variantIndex}"
                  >
                    0
                  </span>


                  <button
                    type="button"
                    class="quantity-btn"

                    onclick="
                      changeQuantity(
                        ${design.id},
                        ${variantIndex},
                        1
                      )
                    "
                  >
                    +
                  </button>

                </div>

              </div>

            `;


            variantsContainer.appendChild(
              row
            );

          }
        );


        card.appendChild(
          variantsContainer
        );


        grid.appendChild(
          card
        );

      });

    }


    /* =========================================================
       IMAGE LOADING
    ========================================================= */

    function setupImage(
      img,
      filename,
      wrapper
    ) {

      /*
        JSON contains:

        "image": "Design1.jpg"

        So the actual path is:

        Images/Design1.jpg
      */


      img.src =
        "Images/" +
        filename;


      img.onerror = function() {

        img.onerror = null;

        img.style.display =
          "none";


        wrapper.classList.add(
          "image-missing"
        );


        const message =
          document.createElement("span");


        message.textContent =
          "Image unavailable";


        wrapper.appendChild(
          message
        );

      };

    }


    /* =========================================================
       PRICE FORMAT
    ========================================================= */

    function formatPrice(price) {

      return Number(price)
        .toLocaleString("en-IN");

    }


    /* =========================================================
       CART KEY
    ========================================================= */

    function getCartKey(
      designId,
      variantIndex
    ) {

      return `${designId}-${variantIndex}`;

    }


    /* =========================================================
       CHECKBOX
    ========================================================= */

    function toggleVariant(
      designId,
      variantIndex,
      selected
    ) {

      const key =
        getCartKey(
          designId,
          variantIndex
        );


      if (selected) {

        if (!cart[key]) {

          cart[key] = 1;

        }

      }

      else {

        delete cart[key];

      }


      updateVariantUI(
        designId,
        variantIndex
      );


      updateCardSelection(
        designId
      );


      updateCart();

    }


    /* =========================================================
       QUANTITY
    ========================================================= */

    function changeQuantity(
      designId,
      variantIndex,
      amount
    ) {

      const key =
        getCartKey(
          designId,
          variantIndex
        );


      let quantity =
        cart[key] || 0;


      quantity += amount;


      if (quantity <= 0) {

        delete cart[key];

      }

      else {

        cart[key] =
          quantity;

      }


      updateVariantUI(
        designId,
        variantIndex
      );


      updateCardSelection(
        designId
      );


      updateCart();

    }


    /* =========================================================
       UPDATE VARIANT UI
    ========================================================= */

    function updateVariantUI(
      designId,
      variantIndex
    ) {

      const key =
        getCartKey(
          designId,
          variantIndex
        );


      const quantity =
        cart[key] || 0;


      const quantityElement =
        document.getElementById(
          `qty-${designId}-${variantIndex}`
        );


      if (quantityElement) {

        quantityElement.textContent =
          quantity;

      }


      const checkbox =
        document.querySelector(
          `input[data-design-id="${designId}"][data-variant-index="${variantIndex}"]`
        );


      if (checkbox) {

        checkbox.checked =
          quantity > 0;

      }

    }


    /* =========================================================
       UPDATE CARD SELECTION
    ========================================================= */

    function updateCardSelection(
      designId
    ) {

      const card =
        document.getElementById(
          `design-card-${designId}`
        );


      if (!card) {

        return;

      }


      const design =
        designs.find(
          item =>
            item.id === designId
        );


      if (!design) {

        return;

      }


      let selected =
        false;


      design.variants.forEach(
        (_, variantIndex) => {

          const key =
            getCartKey(
              designId,
              variantIndex
            );


          if (
            cart[key] &&
            cart[key] > 0
          ) {

            selected = true;

          }

        }
      );


      card.classList.toggle(
        "selected",
        selected
      );

    }


    /* =========================================================
       CART TOTAL
    ========================================================= */

    function getCartTotal() {

      let total = 0;


      designs.forEach(
        design => {

          design.variants.forEach(
            (variant, variantIndex) => {

              const key =
                getCartKey(
                  design.id,
                  variantIndex
                );


              const quantity =
                cart[key] || 0;


              total +=
                variant.price *
                quantity;

            }
          );

        }
      );


      return total;

    }


    /* =========================================================
       CART COUNT
    ========================================================= */

    function getCartItemCount() {

      let count = 0;


      Object.values(cart)
        .forEach(quantity => {

          count += quantity;

        });


      return count;

    }


    /* =========================================================
       UPDATE CART BAR
    ========================================================= */

    function updateCart() {

      const count =
        getCartItemCount();


      const total =
        getCartTotal();


      document.getElementById(
        "cartCount"
      ).textContent =
        `${count} ${count === 1 ? "item" : "items"}`;


      document.getElementById(
        "cartTotal"
      ).textContent =
        `₹${formatPrice(total)}`;

    }


    /* =========================================================
       OPEN CART
    ========================================================= */

    function openCart() {

      const orderItems =
        document.getElementById(
          "orderItems"
        );


      orderItems.innerHTML = "";


      let hasItems = false;


      designs.forEach(
        design => {

          design.variants.forEach(
            (variant, variantIndex) => {

              const key =
                getCartKey(
                  design.id,
                  variantIndex
                );


              const quantity =
                cart[key] || 0;


              if (quantity <= 0) {

                return;

              }


              hasItems = true;


              const subtotal =
                variant.price *
                quantity;


              const item =
                document.createElement("div");


              item.className =
                "order-item";


              item.innerHTML = `

                <div class="order-thumb-wrapper">

                  <img
                    class="order-thumb"
                    src="Images/${escapeHtml(design.image)}"
                    alt="${escapeHtml(design.name)}"
                    onerror="
                      this.style.display='none'
                    "
                  >

                </div>


                <div class="order-details">

                  <div class="order-name">
                    Design #${design.id}
                  </div>

                  <div class="order-meta">

                    Size:
                    ${escapeHtml(variant.size)}

                    <br>

                    Quantity:
                    ${quantity}

                    <br>

                    ₹${formatPrice(variant.price)}
                    each

                  </div>

                </div>


                <div class="order-subtotal">

                  ₹${formatPrice(subtotal)}

                </div>

              `;


              orderItems.appendChild(
                item
              );

            }
          );

        }
      );


      if (!hasItems) {

        orderItems.innerHTML = `

          <div class="empty-cart">

            Your order is empty.

            <br><br>

            Select a design and quantity first.

          </div>

        `;

      }


      document.getElementById(
        "modalTotal"
      ).textContent =
        `₹${formatPrice(getCartTotal())}`;


      document.getElementById(
        "orderModal"
      ).classList.add("show");

    }


    /* =========================================================
       CLOSE CART
    ========================================================= */

    function closeCart() {

      document.getElementById(
        "orderModal"
      ).classList.remove("show");

    }


    /* =========================================================
       PLACE ORDER
    ========================================================= */

    function placeOrder() {

      if (
        Object.keys(cart).length === 0
      ) {

        alert(
          "Please select at least one design before placing your order."
        );

        return;

      }


      let message =
        "Hi Swapnali 👋\n\n";


      message +=
        "I would like to place an order for these Rangoli designs:\n\n";


      designs.forEach(
        design => {

          design.variants.forEach(
            (variant, variantIndex) => {

              const key =
                getCartKey(
                  design.id,
                  variantIndex
                );


              const quantity =
                cart[key] || 0;


              if (quantity <= 0) {

                return;

              }


              const subtotal =
                variant.price *
                quantity;


              message +=
                `Design #${design.id}\n`;


              message +=
                `Size: ${variant.size}\n`;


              message +=
                `Quantity: ${quantity}\n`;


              message +=
                `Price: ₹${formatPrice(variant.price)} each\n`;


              message +=
                `Subtotal: ₹${formatPrice(subtotal)}\n\n`;

            }
          );

        }
      );


      const total =
        getCartTotal();


      message +=
        `Total Order Value (Excluding Shipping Charges): ₹${formatPrice(total)}\n\n`;


      message +=
        "* Shipping Charges Applicable as per location.\n\n";


      message +=
        "Order will be dispatched within 10 to 12 days.\n\n";


      message +=
        "Please confirm availability and final shipping charges. Thank you! 🌸";


      /*
        WhatsApp number from your existing code.
      */

      const whatsappURL =
        "https://wa.me/917972313283?text=" +
        encodeURIComponent(message);


      window.open(
        whatsappURL,
        "_blank"
      );

    }


    /* =========================================================
       CLOSE MODAL WHEN CLICKING OUTSIDE
    ========================================================= */

    document
      .getElementById("orderModal")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            closeCart();

          }

        }
      );


    /* =========================================================
       INITIALIZE
    ========================================================= */

    loadDesigns();

  </script>

</body>

</html>
